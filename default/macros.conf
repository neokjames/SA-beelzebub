[beelzebub_index]
definition   = index=honeypot
description  = Index containing beelzebub:json events. Update this definition if your index name differs from "honeypot".

[beelzebub_novelty_retention]
definition   = -365d
description  = Retention window for the Beelzebub novelty KV stores. Rows whose first_seen is older than this (relative time string accepted by relative_time(), must be a negative offset) are pruned by the weekly maintenance saved searches.
