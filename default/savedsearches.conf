[Beelzebub - Top Attacker IPs - Report]
search           = `beelzebub_index` sourcetype="beelzebub:json" | stats count AS attempts BY src_ip | sort -attempts | head 20
description      = Top 20 source IPs by event count
dispatch.earliest_time = -24h@h
dispatch.latest_time   = now
enableSched      = 0

[Beelzebub - Protocol Breakdown - Report]
search           = `beelzebub_index` sourcetype="beelzebub:json" | stats count BY transport | sort -count
description      = Event counts per honeypot protocol
dispatch.earliest_time = -24h@h
dispatch.latest_time   = now
enableSched      = 0

[Beelzebub - Top Credentials - Report]
search           = `beelzebub_index` sourcetype="beelzebub:json" event.User=* | stats count BY user, event.Password | sort -count | head 20
description      = Most commonly attempted username/password pairs
dispatch.earliest_time = -24h@h
dispatch.latest_time   = now
enableSched      = 0

[Beelzebub - Commands Issued - Report]
search           = `beelzebub_index` sourcetype="beelzebub:json" event.Command!="" | stats count BY command, src_ip | sort -count
description      = Commands run by attackers during interactive sessions
dispatch.earliest_time = -24h@h
dispatch.latest_time   = now
enableSched      = 0

[Beelzebub - Credential Spray Alert]
search           = `beelzebub_index` sourcetype="beelzebub:json" event.User=* | stats dc(event.Password) AS unique_pw count AS attempts BY src_ip | where unique_pw > 10
description      = Fires when a single IP tries more than 10 distinct passwords in the window
dispatch.earliest_time = -1h@h
dispatch.latest_time   = now
enableSched      = 1
cron_schedule    = */15 * * * *
alert.severity   = 3
alert.suppress   = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
action.email.sendresults = 0

[Beelzebub - High Volume Attacker Alert]
search           = `beelzebub_index` sourcetype="beelzebub:json" | stats count AS attempts BY src_ip | where attempts > 100
description      = Fires when a single IP generates more than 100 events in an hour
dispatch.earliest_time = -1h@h
dispatch.latest_time   = now
enableSched      = 1
cron_schedule    = */30 * * * *
alert.severity   = 2
alert.suppress   = 1
alert.suppress.fields = src_ip
alert.suppress.period = 2h
action.email.sendresults = 0

[Beelzebub - Interactive Session Started Alert]
search           = `beelzebub_index` sourcetype="beelzebub:json" event.Status=Interaction | stats count BY src_ip, user, transport
description      = Attacker escalated to an interactive session
dispatch.earliest_time = -15m
dispatch.latest_time   = now
enableSched      = 1
cron_schedule    = */5 * * * *
alert.severity   = 4
alert.suppress   = 0
action.email.sendresults = 0
