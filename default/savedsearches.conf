# ── Maintenance: KV store retention ──────────────────────────────────────────
# Weekly per-collection prune. Replaces the collection with only rows whose
# first_seen falls inside `beelzebub_novelty_retention`. Includes a safety
# guard via `eventstats` that aborts the write if the filter would empty the
# collection (protects against a misconfigured retention macro).

[Beelzebub - Maintenance - Prune First Seen src_ip]
description      = Weekly: drop src_ip first-seen rows older than `beelzebub_novelty_retention` from KV store. Safety guard prevents accidental wipe.
search           = | inputlookup beelzebub_first_seen_src_ip \
| eval _cutoff = relative_time(now(), "`beelzebub_novelty_retention`") \
| where first_seen >= _cutoff \
| eventstats count AS _kept \
| where _kept > 0 \
| fields - _cutoff _kept \
| outputlookup beelzebub_first_seen_src_ip \
| stats count AS rows_retained \
| eval collection="beelzebub_first_seen_src_ip", retention_window="`beelzebub_novelty_retention`"
dispatch.earliest_time = -1d
dispatch.latest_time   = now
enableSched      = 1
cron_schedule    = 30 3 * * 0
action.email.sendresults = 0

