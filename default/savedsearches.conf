# ── Novelty Trackers ─────────────────────────────────────────────────────────
# Hourly searches that detect previously-unseen entities and insert them into
# per-entity KV store collections. Idempotent: re-running the same window is a
# no-op because rows whose md5 _key is already present are filtered out before
# `outputlookup`. `first_seen` is never overwritten. Schedules staggered to
# avoid 6 searches contending at the same minute.

[Beelzebub - Tracker - First Seen src_ip]
description      = Hourly: detect previously-unseen attacker IPs and write them to KV store.
search           = `beelzebub_index` sourcetype="beelzebub:json" msg="New Event" event.SourceIp=* \
| stats min(_time) AS first_seen, max(_time) AS last_seen, count AS events, values(transport) AS protocols BY src_ip \
| eval protocols = mvjoin(protocols, ",") \
| eval _key = md5(src_ip) \
| lookup beelzebub_first_seen_src_ip _key OUTPUT first_seen AS _existing \
| where isnull(_existing) \
| fields - _existing \
| outputlookup append=true key_field=_key beelzebub_first_seen_src_ip
dispatch.earliest_time = -1h@h
dispatch.latest_time   = @h
enableSched      = 1
cron_schedule    = 5 * * * *
schedule_window  = 10
action.email.sendresults = 0

[Beelzebub - Tracker - First Seen Credential]
description      = Hourly: detect previously-unseen username+password tuples.
search           = `beelzebub_index` sourcetype="beelzebub:json" msg="New Event" event.User=* event.Password=* \
| rename user AS username \
| stats min(_time) AS first_seen, max(_time) AS last_seen, count AS events, values(src_ip) AS sample_src_ip BY username, password \
| eval sample_src_ip = mvindex(sample_src_ip, 0) \
| eval _key = md5(username . "\x00" . password) \
| lookup beelzebub_first_seen_credential _key OUTPUT first_seen AS _existing \
| where isnull(_existing) \
| fields - _existing \
| outputlookup append=true key_field=_key beelzebub_first_seen_credential
dispatch.earliest_time = -1h@h
dispatch.latest_time   = @h
enableSched      = 1
cron_schedule    = 7 * * * *
schedule_window  = 10
action.email.sendresults = 0

